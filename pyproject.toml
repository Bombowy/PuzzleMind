[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[project]
name = "logicforge"
version = "0.1.0"
description = "A modular computer-vision and rule-based deduction framework for logic puzzle games."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LogicForge contributors" }]
keywords = ["computer-vision", "logic-puzzles", "rule-engine", "solver"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Bombowy/PuzzleMind"
Documentation = "https://github.com/Bombowy/PuzzleMind/tree/main/docs"
Issues = "https://github.com/Bombowy/PuzzleMind/issues"
Repository = "https://github.com/Bombowy/PuzzleMind.git"

[dependency-groups]
dev = [
  "black>=25.1.0,<27",
  "mypy>=1.15.0,<2",
  "pytest>=8.3.0,<10",
  "pytest-cov>=6.0.0,<8",
  "ruff>=0.11.0,<0.15",
]

[tool.uv.build-backend]
module-name = "logicforge"
module-root = ""
source-include = [
  "ARCHITECTURE.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "ROADMAP.md",
  "docs/**",
  "examples/**",
  "tests/**",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["logicforge", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["logicforge"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["logicforge", "tests"]
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=logicforge --cov-report=term-missing"
minversion = "8.3"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["logicforge"]

[tool.coverage.report]
show_missing = true
skip_empty = true
