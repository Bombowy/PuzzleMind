name: Feature request
description: Propose a capability or architectural improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or contributor problem, not only a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: Explain affected boundaries, alternatives, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation strategy
      description: Describe tests, fixtures, safety checks, or acceptance criteria.
    validations:
      required: true
