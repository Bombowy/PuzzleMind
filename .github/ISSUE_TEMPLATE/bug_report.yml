name: Bug report
description: Report reproducible incorrect behavior in LogicForge.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal, privacy-safe reproduction and relevant fixtures.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: LogicForge version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version, and uv version.
    validations:
      required: true
